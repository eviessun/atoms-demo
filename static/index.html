<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atoms Demo</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚛</span>
      <span data-i18n="brand">Atoms Demo</span>
    </div>
    <div class="topbar-right">
      <label class="model-picker" id="model-picker">
        <span class="model-picker-label" data-i18n="app.model">模型</span>
        <select id="model-select" data-i18n-tooltip="app.model_tooltip" title="选择生成模型 / Choose the model"></select>
        <button type="button" class="byok-gear" id="byok-gear"
                data-i18n-tooltip="app.model_byok_settings" title="配置自备 Key">⚙</button>
      </label>
      <button class="lang-toggle" id="lang-toggle" data-i18n="lang.toggle"
              data-i18n-tooltip="lang.switch_tooltip" title="切换语言 / Switch language">🌐 中</button>
      <div class="auth-box" id="auth-box">
        <!-- filled by JS: either a "登录/注册" link or user + logout -->
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- Left: saved projects -->
    <aside class="projects-panel">
      <div class="projects-head">
        <span data-i18n="app.projects">我的项目</span>
        <button id="refresh-projects" title="Refresh" class="icon-btn">⟳</button>
      </div>
      <ul class="projects-list" id="projects-list">
        <li class="empty" id="projects-empty" data-i18n="app.projects_empty_guest">登录后即可保存并回看你的应用。</li>
      </ul>
    </aside>

    <!-- Drag to resize the projects panel (collapsible to 0) -->
    <div class="resizer" data-target="projects" title="拖动调整宽度 / Drag to resize"></div>

    <!-- Middle: chat / prompt panel (flexible — absorbs resize) -->
    <section class="chat-panel">
      <div class="messages" id="messages">
        <div class="msg assistant">
          <p data-i18n="app.intro">描述一个应用，我来帮你生成，并在右侧预览。</p>
          <p class="hint" data-i18n="app.intro_hint">试试：“一个带开始/暂停的番茄钟和任务清单”。</p>
        </div>
      </div>
      <!-- Drag up/down to resize the input area -->
      <div class="resizer-h" data-target="composer" title="拖动调整高度 / Drag to resize"></div>
      <!-- Mode banner: shows whether we're building a new app or editing one -->
      <div class="mode-bar" id="mode-bar">
        <span class="mode-label" id="mode-label" data-i18n="app.mode_new">新建应用</span>
        <span class="mode-spacer"></span>
        <button type="button" id="history-btn" class="history-btn hidden"
                data-i18n-tooltip="app.history_open" title="查看版本历史">🕘 <span data-i18n="app.history">版本历史</span></button>
        <button type="button" id="new-app" class="new-app hidden" data-i18n="app.new_app">＋ 新应用</button>
      </div>
      <!-- File tree (Trae-style): the app we generate is a single index.html.
           Click it to open its source in the preview panel's Code tab. -->
      <div class="file-strip hidden" id="file-strip">
        <span class="file-strip-label" data-i18n="app.files">文件</span>
        <button type="button" class="file-chip" id="file-chip" data-file="index.html">
          <span class="file-icon" aria-hidden="true">📄</span>
          <span class="file-name">index.html</span>
        </button>
      </div>
      <form class="composer" id="composer">
        <!-- Attached image thumbnails (base64 previews), shown only when images
             are staged. Each chip has a remove (✕) button. -->
        <div class="attach-strip hidden" id="attach-strip"></div>
        <!-- Textarea + in-field tool icons (image / voice) docked bottom-left -->
        <div class="input-wrap">
          <textarea id="prompt" rows="3" data-i18n-placeholder="app.prompt_ph" placeholder="描述你想要的应用…"></textarea>
          <div class="input-tools">
            <!-- Attach image: enabled only for vision-capable models (JS toggles
                 the disabled state + tooltip from /api/models `vision`). -->
            <button type="button" class="composer-tool" id="attach-btn"
                    data-i18n-tooltip="app.attach_image" title="添加图片" aria-label="添加图片">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <circle cx="8.5" cy="9" r="1.5"/>
                <path d="M21 16l-5-5L7 20"/>
              </svg>
            </button>
            <!-- Voice input: browser Web Speech API transcribes into the textarea.
                 Hidden entirely when the browser doesn't support it. -->
            <button type="button" class="composer-tool" id="mic-btn"
                    data-i18n-tooltip="app.voice_input" title="语音输入" aria-label="语音输入">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3"/>
                <path d="M5 11a7 7 0 0 0 14 0"/>
                <path d="M12 18v3"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="file" id="image-input" accept="image/*" multiple hidden />
        <div class="composer-actions">
          <span class="composer-spacer"></span>
          <button type="submit" id="send" data-i18n="app.generate">生成</button>
        </div>
      </form>
    </section>

    <!-- Drag to resize the preview panel (collapsible to 0) -->
    <div class="resizer" data-target="preview" title="拖动调整宽度 / Drag to resize"></div>

    <!-- Right: live preview -->
    <section class="preview-panel">
      <div class="preview-toolbar">
        <div class="preview-tabs" id="preview-tabs" role="tablist">
          <button type="button" class="preview-tab active" id="tab-preview"
                  data-tab="preview" role="tab" data-i18n="app.tab_preview">预览</button>
          <button type="button" class="preview-tab" id="tab-code"
                  data-tab="code" role="tab" data-i18n="app.tab_code">代码</button>
        </div>
        <span class="status" id="status" data-i18n="status.idle">空闲</span>
      </div>
      <div class="preview-body">
        <div class="preview-placeholder" id="preview-placeholder">
          <div class="ph-icon" aria-hidden="true">
            <svg viewBox="0 0 120 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
              <!-- app window -->
              <rect x="10" y="14" width="100" height="72" rx="10"
                    fill="var(--tint)" stroke="var(--tint-border)" stroke-width="2"/>
              <!-- title bar dots -->
              <line x1="10" y1="30" x2="110" y2="30" stroke="var(--tint-border)" stroke-width="2"/>
              <circle cx="21" cy="22" r="2.4" fill="var(--accent)" opacity="0.55"/>
              <circle cx="30" cy="22" r="2.4" fill="var(--accent)" opacity="0.3"/>
              <circle cx="39" cy="22" r="2.4" fill="var(--accent)" opacity="0.3"/>
              <!-- content skeleton lines -->
              <rect x="24" y="44" width="46" height="6" rx="3" fill="var(--accent)" opacity="0.35"/>
              <rect x="24" y="58" width="72" height="5" rx="2.5" fill="var(--muted)" opacity="0.35"/>
              <rect x="24" y="69" width="58" height="5" rx="2.5" fill="var(--muted)" opacity="0.35"/>
              <!-- generate sparkle -->
              <path d="M92 40 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6z"
                    fill="var(--accent)"/>
              <circle cx="104" cy="38" r="2.2" fill="var(--accent)" opacity="0.7"/>
            </svg>
          </div>
          <p class="ph-title" data-i18n="app.preview_ph_title">应用预览会显示在这里</p>
          <p class="ph-hint" data-i18n="app.preview_ph_hint">在左侧描述一个应用，然后点击“生成”。</p>
        </div>
        <iframe id="preview" title="preview" class="hidden"
                sandbox="allow-scripts allow-forms allow-modals"></iframe>
        <!-- Code view: shows the generated index.html source. Fills live while
             streaming, then holds the final source once generation completes. -->
        <div class="code-view hidden" id="code-view">
          <div class="code-view-head">
            <span class="code-view-file">index.html</span>
            <div class="code-actions">
              <button type="button" class="code-copy" id="code-copy"
                      data-i18n-tooltip="app.copy" title="复制 / Copy">⧉</button>
              <button type="button" class="code-copy" id="code-download"
                      data-i18n-tooltip="app.download" title="下载 index.html">⬇</button>
              <button type="button" class="code-copy" id="code-open"
                      data-i18n-tooltip="app.open_tab" title="在新标签页打开">↗</button>
            </div>
          </div>
          <pre class="code-view-body"><code id="code-content"></code></pre>
        </div>
      </div>
    </section>
  </main>

  <!-- BYOK dialog: user enters their own API key + model (stored only in the
       browser; sent per-request; never persisted server-side). -->
  <div class="modal-overlay hidden" id="byok-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="byok-title">
      <div class="modal-head">
        <h2 id="byok-title" data-i18n="byok.title">自定义模型（自备 Key）</h2>
        <button type="button" class="modal-close" id="byok-x" aria-label="close">✕</button>
      </div>
      <p class="modal-intro" data-i18n="byok.intro"></p>
      <form id="byok-form" class="byok-form">
        <label class="byok-field">
          <span data-i18n="byok.provider">服务商</span>
          <select id="byok-provider"></select>
        </label>
        <label class="byok-field">
          <span data-i18n="byok.transport">接口类型</span>
          <select id="byok-transport">
            <option value="openai" data-i18n="byok.transport_openai">OpenAI 兼容</option>
            <option value="anthropic" data-i18n="byok.transport_anthropic">Anthropic (Claude)</option>
          </select>
        </label>
        <label class="byok-field">
          <span data-i18n="byok.base_url">API 地址（Base URL）</span>
          <input type="text" id="byok-base-url" autocomplete="off" spellcheck="false"
                 placeholder="https://api.deepseek.com/v1" />
        </label>
        <label class="byok-field">
          <span data-i18n="byok.model">模型名称</span>
          <input type="text" id="byok-model" autocomplete="off" spellcheck="false"
                 placeholder="deepseek-chat" />
        </label>
        <label class="byok-field">
          <span data-i18n="byok.key">API Key</span>
          <input type="password" id="byok-key" autocomplete="off" spellcheck="false"
                 placeholder="sk-..." />
        </label>
        <a class="byok-docs hidden" id="byok-docs" href="#" target="_blank" rel="noopener"
           data-i18n="byok.docs">如何申请 Key ↗</a>
        <p class="byok-security" data-i18n="byok.security"></p>
        <div class="byok-actions">
          <button type="button" class="ghost" id="byok-clear" data-i18n="byok.clear">清除已存 Key</button>
          <span class="spacer"></span>
          <button type="button" class="ghost" id="byok-cancel" data-i18n="byok.cancel">取消</button>
          <button type="submit" id="byok-save" data-i18n="byok.save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Version history dialog: lists a project's snapshots (newest first) with
       Preview (load into the iframe without committing) and Roll back (restore,
       itself recorded as a new version so nothing is ever lost). -->
  <div class="modal-overlay hidden" id="history-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <div class="modal-head">
        <h2 id="history-title" data-i18n="app.history">版本历史</h2>
        <button type="button" class="modal-close" id="history-x" aria-label="close">✕</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
