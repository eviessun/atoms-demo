<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>专注番茄钟 / Focus Pomodoro</title>
<style>
  :root {
    --bg-start: #f5f7fa;
    --bg-end: #e4edf5;
    --ring-bg: #e0e0e0;
    --focus: #4caf50;
    --short: #ff9800;
    --long: #2196f3;
    --text: #222;
    --muted: #555;
    --input-bg: #fff;
    --border-radius: 12px;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --transition: all 0.2s ease;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    color: var(--text);
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh; padding:1rem;
  }
  .app {
    width:100%; max-width:900px;
    display:flex; flex-direction:column; gap:1.5rem;
    background:#fff; border-radius:var(--border-radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  header {
    text-align:center; padding:1.5rem 1rem;
    background:linear-gradient(90deg, var(--focus), var(--short));
    color:#fff; font-size:1.5rem;
  }
  .timer-container {
    display:flex; flex-direction:column; align-items:center; gap:1rem;
    padding:1rem;
  }
  .mode-tabs {
    display:flex; gap:0.5rem;
  }
  .mode-tabs button {
    flex:1; padding:0.5rem 1rem; border:none; border-radius:var(--border-radius);
    background:#e9ecef; color:var(--muted); font-weight:600;
    cursor:pointer; transition:var(--transition);
  }
  .mode-tabs button.active,
  .mode-tabs button:hover {
    background:var(--focus); color:#fff;
  }
  .ring-wrapper {
    position:relative; width:180px; height:180px;
  }
  .timer-svg {
    width:100%; height:100%; transform:rotate(-90deg);
  }
  .timer-bg { fill:none; stroke:var(--ring-bg); stroke-width:10; }
  .timer-progress {
    fill:none; stroke-width:10; stroke-linecap:round;
    transition:stroke-dashoffset 0.1s linear;
  }
  .timer-progress.focus { stroke:var(--focus); }
  .timer-progress.short { stroke:var(--short); }
  .timer-progress.long { stroke:var(--long); }
  .timer-display {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:1.2rem;
    color:var(--text);
  }
  .timer-display .time { font-size:2.2rem; font-weight:600; }
  .timer-display .current-task { font-size:0.9rem; color:var(--muted); margin-top:0.3rem; }
  .controls {
    display:flex; gap:0.8rem; flex-wrap:wrap; justify-content:center;
  }
  .btn-primary, .btn-secondary {
    border:none; border-radius:var(--border-radius); padding:0.6rem 1.2rem;
    font-size:1rem; cursor:pointer; transition:var(--transition);
    font-weight:600;
  }
  .btn-primary { background:var(--focus); color:#fff; }
  .btn-secondary { background:#e9ecef; color:var(--muted); }
  .btn-primary:hover { background:#43a047; }
  .btn-secondary:hover { background:#dfe4ea; }
  .pomodoros {
    font-size:1rem; color:var(--muted); display:flex; align-items:center; gap:0.4rem;
  }
  .settings {
    display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; font-size:0.9rem;
    color:var(--muted);
  }
  .settings label { display:flex; align-items:center; gap:0.3rem; }
  .settings input[type="number"] {
    width:4rem; padding:0.2rem 0.4rem; border:1px solid #ccc; border-radius:4px;
    text-align:center;
  }
  .task-list {
    flex:1; display:flex; flex-direction:column; gap:1rem; padding:1rem;
  }
  .task-list h2 { margin:0 0 0.5rem; font-size:1.2rem; color:var(--text); }
  .input-group {
    display:flex; gap:0.5rem;
  }
  #taskInput {
    flex:1; padding:0.5rem 0.8rem; border:1px solid #ccc; border-radius:var(--border-radius);
    font-size:1rem;
  }
  #addTaskBtn {
    flex:0 0 auto; padding:0.5rem 1rem; border:none; border-radius:var(--border-radius);
    background:var(--focus); color:#fff; cursor:pointer;
  }
  #addTaskBtn:hover { background:#43a047; }
  ul#taskList {
    list-style:none; margin:0; padding:0; flex:1; overflow-y:auto;
  }
  .task-item {
    display:flex; align-items:center; gap:0.8rem; padding:0.5rem;
    border-bottom:1px solid #eee;
  }
  .task-item .task-text {
    flex:1; font-size:1rem; word-break:break-word;
  }
  .task-item .task-text.done { text-decoration:line-through; color:var(--muted); }
  .task-item button {
    background:none; border:none; color:#c00; cursor:pointer; font-size:1.2rem;
    padding:0.2rem;
  }
  .task-item button:hover { color:#f00; }
  .flash {
    animation: flash 0.6s ease;
  }
  @keyframes flash {
    0% { filter: brightness(1); transform: scale(1); }
    50% { filter: brightness(1.3); transform: scale(1.05); }
    100% { filter: brightness(1); transform: scale(1); }
  }
  @media (max-width:600px) {
    .app { flex-direction:column; }
    .timer-container { align-items:stretch; }
    .task-list { order:2; }
  }
</style>
</head>
<body>
<div class="app">
  <header>专注番茄钟 / Focus Pomodoro</header>
  <section class="timer-container">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="focus" aria-label="Focus mode">Focus</button>
      <button class="mode-tab" data-mode="short" aria-label="Short break">Short Break</button>
      <button class="mode-tab" data-mode="long" aria-label="Long break">Long Break</button>
    </div>
    <div class="ring-wrapper">
      <svg class="timer-svg" viewBox="0 0 100 100">
        <circle class="timer-bg" cx="50" cy="50" r="45" />
        <circle class="timer-progress focus" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="283" />
      </svg>
      <div class="timer-display">
        <span class="time">25:00</span>
        <div class="current-task">Current task: <span class="task-name"></span></div>
      </div>
    </div>
    <div class="controls">
      <button id="startBtn" class="btn-primary" aria-label="Start timer">▶️ Start</button>
      <button id="pauseBtn" class="btn-secondary" aria-label="Pause timer">⏸️ Pause</button>
      <button id="resetBtn" class="btn-secondary" aria-label="Reset timer">⏮️ Reset</button>
    </div>
    <div class="pomodoros">
      Completed today: <span class="pomodoros-count">0</span> 🍅
    </div>
    <div class="settings">
      <label>Focus: <input type="number" id="focusInput" min="1" value="25"> min</label>
      <label>Short: <input type="number" id="shortInput" min="1" value="5"> min</label>
      <label>Long: <input type="number" id="longInput" min="1" value="15"> min</label>
    </div>
  </section>
  <section class="task-list">
    <h2>Tasks</h2>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Add a task..." aria-label="New task">
      <button id="addTaskBtn" aria-label="Add task">+</button>
    </div>
    <ul id="taskList"></ul>
  </section>
</div>

<script>
(() => {
  // State
  let focusMinutes = 25, shortMinutes = 5, longMinutes = 15;
  const durations = {
    focus: focusMinutes * 60,
    short: shortMinutes * 60,
    long: longMinutes * 60
  };
  let currentMode = 'focus';
  let remaining = durations[currentMode];
  let timerInterval = null;
  let isRunning = false;
  let pomodorosCompleted = 0;
  const tasks = [];

  // DOM
  const modeTabs = document.querySelectorAll('.mode-tab');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const timeDisplay = document.querySelector('.time');
  const progressCircle = document.querySelector('.timer-progress');
  const currentTaskSpan = document.querySelector('.task-name');
  const pomodorosCount = document.querySelector('.pomodoros-count');
  const focusInput = document.getElementById('focusInput');
  const shortInput = document.getElementById('shortInput');
  const longInput = document.getElementById('longInput');
  const taskInput = document.getElementById('taskInput');
  const addTaskBtn = document.getElementById('addTaskBtn');
  const taskList = document.getElementById('taskList');

  // Init
  function init() {
    updateDurationFromInputs();
    renderModeUI();
    updateTimeDisplay();
    updateProgressCircle();
    updateCurrentTask();
    renderTasks();
    // Enable audio context on first user interaction
    document.addEventListener('click', () => {
      if (window.AudioContext || window.webkitAudioContext) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
      }
    }, {once:true});
  }

  // Duration handling
  function updateDurationFromInputs() {
    focusMinutes = parseInt(focusInput.value) || 25;
    shortMinutes = parseInt(shortInput.value) || 5;
    longMinutes = parseInt(longInput.value) || 15;
    durations.focus = focusMinutes * 60;
    durations.short = shortMinutes * 60;
    durations.long = longMinutes * 60;
  }

  // UI updates
  function renderModeUI() {
    modeTabs.forEach(tab => {
      tab.classList.toggle('active', tab.dataset.mode === currentMode);
    });
    progressCircle.className = 'timer-progress ' + currentMode;
  }

  function updateTimeDisplay() {
    const mins = String(Math.floor(remaining / 60)).padStart(2,'0');
    const secs = String(remaining % 60).padStart(2,'0');
    timeDisplay.textContent = `${mins}:${secs}`;
  }

  function updateProgressCircle() {
    const total = durations[currentMode];
    const offset = 283 * (remaining / total); // 2*PI*45 ≈ 283
    progressCircle.style.strokeDashoffset = 283 - offset;
  }

  function updateCurrentTask() {
    const task = tasks.find(t => !t.done);
    currentTaskSpan.textContent = task ? task.text : 'No tasks';
  }

  function renderTasks() {
    taskList.innerHTML = '';
    tasks.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <button class="toggle-done" aria-label="${t.done ? 'Mark as undone' : 'Mark as done'}">
          ${t.done ? '✔' : '○'}
        </button>
        <span class="task-text ${t.done ? 'done' : ''}">${t.text}</span>
        <button class="delete" aria-label="Delete task">✕</button>
      `;
      li.querySelector('.toggle-done').addEventListener('click', () => {
        t.done = !t.done;
        updateCurrentTask();
        renderTasks();
      });
      li.querySelector('.delete').addEventListener('click', () => {
        const idx = tasks.indexOf(t);
        if (idx > -1) tasks.splice(idx,1);
        updateCurrentTask();
        renderTasks();
      });
      taskList.appendChild(li);
    });
  }

  // Timer control
  function startTimer() {
    if (isRunning) return;
    isRunning = true;
    timerInterval = setInterval(tick, 1000);
  }

  function pauseTimer() {
    if (!isRunning) return;
    isRunning = false;
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer() {
    pauseTimer();
    remaining = durations[currentMode];
    updateTimeDisplay();
    updateProgressCircle();
  }

  function tick() {
    if (remaining <= 0) {
      pauseTimer();
      onTimerEnd();
      return;
    }
    remaining--;
    updateTimeDisplay();
    updateProgressCircle();
  }

  function onTimerEnd() {
    // Flash ring
    progressCircle.classList.add('flash');
    setTimeout(() => progressCircle.classList.remove('flash'), 600);
    // Play chime
    playChime();
    // Handle mode transition
    if (currentMode === 'focus') {
      pomodorosCompleted++;
      pomodorosCount.textContent = pomodorosCompleted;
      // Auto suggest break
      if (pomodorosCompleted % 4 === 0) {
        currentMode = 'long';
      } else {
        currentMode = 'short';
      }
    } else {
      // break ended -> back to focus
      currentMode = 'focus';
    }
    remaining = durations[currentMode];
    updateTimeDisplay();
    updateProgressCircle();
    renderModeUI();
    updateCurrentTask();
  }

  // Chime via Web Audio API
  function playChime() {
    if (!(window.AudioContext || window.webkitAudioContext)) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, ctx.currentTime); // A4
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.01);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  }

  // Event listeners
  modeTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.dataset.mode === currentMode) return;
      pauseTimer();
      currentMode = tab.dataset.mode;
      remaining = durations[currentMode];
      updateTimeDisplay();
      updateProgressCircle();
      renderModeUI();
      updateCurrentTask();
    });
  });

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetTimer);

  focusInput.addEventListener('change', updateDurationFromInputs);
  shortInput.addEventListener('change', updateDurationFromInputs);
  longInput.addEventListener('change', updateDurationFromInputs);

  addTaskBtn.addEventListener('click', () => {
    const text = taskInput.value.trim();
    if (text) {
      tasks.push({ id: Date.now(), text, done: false });
      taskInput.value = '';
      updateCurrentTask();
      renderTasks();
    }
  });

  taskInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') addTaskBtn.click();
  });

  // Initialize
  init();
})();
</script>
</body>
</html>
