<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>城市漫游 / City Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#fafafa;
  --primary:#2c3e50;
  --accent:#e67e22;
  --card-bg:#ffffff;
  --text:#333;
  --muted:#777;
  --pin:#e74c3c;
  --pin-active:#f1c40f;
  --transition:0.3s ease;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);}
header{padding:1rem;text-align:center;background:var(--primary);color:#fff;}
h1{margin:0;font-size:1.5rem;}
.city-selector{display:flex;overflow-x:auto;gap:0.5rem;justify-content:center;padding:0.5rem;}
.city-selector button{
  min-width:60px;padding:0.4rem 0.8rem;border:none;border-radius:20px;
  background:rgba(255,255,255,0.2);color:#fff;cursor:pointer;font-size:0.9rem;
  transition:var(--transition);
}
.city-selector button.active,
.city-selector button:hover{background:rgba(255,255,255,0.4);}
.container{display:flex;gap:1rem;padding:1rem;max-width:1200px;margin:auto;}
.map-panel{flex:1 1 400px;min-width:260px;}
.attractions-panel{flex:0 0 260px;min-width:200px;display:flex;flex-direction:column;}
.attractions-panel .header-line{
  font-weight:600;margin-bottom:0.5rem;padding:0.2rem;background:rgba(0,0,0,0.05);
  border-radius:4px;
}
.attractions-list{
  list-style:none;margin:0;padding:0;overflow-y:auto;max-height:calc(100vh - 200px);
}
.attractions-list li{
  padding:0.6rem 0.8rem;border-bottom:1px solid #eee;display:flex;align-items:center;gap:0.5rem;cursor:pointer;
}
.attractions-list li:hover,
.attractions-list li.active{background:rgba(0,0,0,0.03);}
.detail-card{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;
  animation:fadeIn .3s;
}
.detail-card.show{display:flex;}
.detail-card-content{
  background:var(--card-bg);border-radius:12px;max-width:90%;width:320px;padding:1.5rem;box-shadow:0 4px 24px rgba(0,0,0,0.2);
  position:relative;animation:slideUp .3s;
}
.close-btn{
  position:absolute;top:.5rem;right:.5rem;background:none;border:none;font-size:1.5rem;cursor:pointer;
}
.category-chip{
  display:inline-block;padding:.2rem .5rem;border-radius:12px;font-size:.8rem;background:#eee;margin-bottom:.5rem;
}
.rating{font-size:1.2rem;color:#f1c40f;margin-top:.5rem;}
svg.city-map{width:100%;height:auto;display:block;background:#fff;border-radius:8px;}
.pin{cursor:pointer;transition:transform .2s;}
.pin:hover{transform:scale(1.3);}
.pin.active{fill:var(--pin-active);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){
  .container{flex-direction:column;}
  .attractions-panel{order:-1;height:200px;}
}
</style>
</head>
<body>
<header>
  <h1>城市漫游 / City Explorer</h1>
  <div class="city-selector" id="citySelector"></div>
</header>
<main class="container">
  <section class="map-panel">
    <svg class="city-map" id="cityMap" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"></svg>
  </section>
  <section class="attractions-panel">
    <div class="header-line" id="cityHeader"></div>
    <ul class="attractions-list" id="attractionsList"></ul>
  </section>
</main>
<div class="detail-card" id="detailCard" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <button class="close-btn" aria-label="Close details">&times;</button>
  <h2 id="detailTitle"></h2>
  <div class="detail-body">
    <span class="category-chip"></span>
    <p class="description"></p>
    <div class="rating">★★★★☆</div>
  </div>
</div>

    ]

  {

    mapSVG:`
      <rect width="400" height="300" fill="#e2e8f0"/>

      <rect x="260" y="100" width="50" height="50" fill="#a8dadc"/>
    `,
    attractions:[

      {name:"浅草寺",en:"Senso-ji",desc:"东京最古老的佛教寺庙。",emoji:"🕌",category:"历史",x:80,y:250},

      {name:"涩谷十字路口",en:"Shibuya Crossing",desc:"世界上最繁忙的人行交叉口。",emoji:"🚶‍♀️",category:"美食",x:200,y:180},

let currentCity = 0;
let selectedAttraction = null;

function renderCitySelector() {
  const container = document.getElementById('citySelector');
  container.innerHTML = '';
  cities.forEach((city,i)=>{
    const btn = document.createElement('button');
    btn.textContent = `${city.name} / ${city.en}`;
    btn.setAttribute('aria-label', `Select ${city.name}`);
    if(i===0) btn.classList.add('active');
    btn.addEventListener('click',()=>selectCity(i));
    container.appendChild(btn);
  });
}
function selectCity(index){
  currentCity = index;
  updateUI();
}
function updateUI(){
  // update selector
  document.querySelectorAll('.city-selector button').forEach((b,i)=>b.classList.toggle('active',i===currentCity));
  // fade out panels
  const mapPanel = document.querySelector('.map-panel');
  const attPanel = document.querySelector('.attractions-panel');
  mapPanel.style.opacity = '0';
  attPanel.style.opacity = '0';
  setTimeout(()=>{
    renderMap();
    renderAttractionsList();
    updateCityHeader();
    mapPanel.style.opacity = '';
    attPanel.style.opacity = '';
  },150);
}
function renderMap(){
  const svg = document.getElementById('cityMap');
  svg.innerHTML = cities[currentCity].mapSVG;
  const pinColor = getComputedStyle(document.documentElement).getPropertyValue('--pin').trim();
  cities[currentCity].attractions.forEach((attr,i)=>{
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',attr.x);
    circle.setAttribute('cy',attr.y);
    circle.setAttribute('r','6');
    circle.setAttribute('fill',pinColor);
    circle.setAttribute('class','pin');
    circle.setAttribute('data-index',i);
    circle.setAttribute('role','button');
    circle.setAttribute('aria-label',`${attr.name} (${attr.en})`);
    circle.setAttribute('tabindex','0');
    svg.appendChild(circle);
    circle.addEventListener('click',()=>selectAttraction(i));
    circle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')selectAttraction(i);});
  });
}
function renderAttractionsList(){
  const ul = document.getElementById('attractionsList');
  ul.innerHTML = '';
  cities[currentCity].attractions.forEach((attr,i)=>{
    const li = document.createElement('li');
    li.textContent = `${attr.emoji} ${attr.name} / ${attr.en}`;
    li.setAttribute('data-index',i);
    li.setAttribute('role','button');
    li.setAttribute('aria-label',`Attraction ${attr.name}`);
    li.setAttribute('tabindex','0');
    li.addEventListener('click',()=>selectAttraction(i));
    li.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')selectAttraction(i);});
    ul.appendChild(li);
  });
}
function updateCityHeader(){
  const header = document.getElementById('cityHeader');
  const city = cities[currentCity];
  header.textContent = `${city.name} · ${city.attractions.length} 处景点`;
}
function selectAttraction(index){
  // clear previous highlights
  document.querySelectorAll('.pin.active').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.attractions-list li.active').forEach(l=>l.classList.remove('active'));
  // set new
  const pin = document.querySelector(`.pin[data-index="${index}"]`);
  if(pin) pin.classList.add('active');
  const li = document.querySelector(`.attractions-list li[data-index="${index}"]`);
  if(li){
    li.classList.add('active');
    li.scrollIntoView({block:'nearest'});
  }
  const attr = cities[currentCity].attractions[index];
  document.getElementById('detailTitle').textContent = `${attr.name} / ${attr.en}`;
  document.querySelector('.detail-card .category-chip').textContent = attr.category;
  document.querySelector('.detail-card .description').textContent = attr.desc;
  document.getElementById('detailCard').classList.add('show');
}
function closeDetail(){
  document.getElementById('detailCard').classList.remove('show');
  document.querySelectorAll('.pin.active').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.attractions-list li.active').forEach(l=>l.classList.remove('active'));
}
document.addEventListener('DOMContentLoaded',()=>{
  renderCitySelector();
  selectCity(0);
  const closeBtn = document.querySelector('.detail-card .close-btn');
  closeBtn.addEventListener('click',closeDetail);
  closeBtn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')closeDetail();});
});
</script>
</body>
</html>
